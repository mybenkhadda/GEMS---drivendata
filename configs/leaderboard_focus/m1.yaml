# GEMS Milestone 1: champion recovery and leaderboard submission (docs/leaderboard_focus/). Code-authoring-first:
# every number is produced in Colab from FROZEN artifacts; nothing is trained, re-inferred or re-benchmarked.
version: m1.1
output_dir: outputs/leaderboard_focus/m1_champion_recovery
p6_output_dir: outputs/p6_fast_track            # read-only source of W2 / boost / recovery artifacts
m9_output_dir: outputs/m9_geofault_production    # read-only: baseline selection (champion fusion weight)
overwrite_existing: false

# ------------------------------------------------------------------------------------------------ artifacts
# Paths relative to the Drive root (MyDrive/GEMS_2). required = blocks M1 when absent; staged = copied to local disk
# by notebook 00 (small files only; the CNN checkpoint directories are never staged).
artifacts:
  - {id: w2_candidate, path: "{p6}/stack/candidate.json", required: true, staged: true, owner: P6 W2}
  - {id: w2_rows, path: "{p6}/stack/features/rows.parquet", required: true, staged: true, owner: P6 W2}
  - {id: w2_stack_grid, path: "{p6}/stack/grid.csv", required: true, staged: true, owner: P6 W2}
  - {id: w2_maps, path: "{p6}/stack/maps/*_[0-9].npy", required: true, staged: true, owner: P6 W2,
     required_files: [geo_0.npy, geo_1.npy, geo_2.npy, disc_official_0.npy, disc_official_1.npy, disc_official_2.npy]}
  - {id: w2_full_score_hist, path: "{p6}/stack/maps/full_score.tif", required: false, staged: true,
     owner: P6 W2 (historical; parity diagnostic only)}
  - {id: boost_a_grid, path: "{p6}/boost/benchmark/grid.csv", required: true, staged: true, owner: P6 boost}
  - {id: boost_a_manifest, path: "{p6}/boost/benchmark/manifest.json", required: true, staged: true, owner: P6 boost}
  - {id: boost_a_status, path: "{p6}/boost/benchmark/status.json", required: false, staged: true,
     owner: P6 boost (grid provenance only)}
  - {id: recovery_decision, path: "{p6}/recovery/export_parity/decision.json", required: false, staged: true,
     owner: P6.1 recovery}
  - {id: recovery_parity, path: "{p6}/recovery/export_parity/train_inference_parity.csv", required: false,
     staged: true, owner: P6.1 recovery}
  - {id: recovery_policies, path: "{p6}/recovery/export_parity/policy_comparison.csv", required: false, staged: true,
     owner: P6.1 recovery}
  - {id: recovery_overlap, path: "{p6}/recovery/export_parity/unit_overlap.csv", required: false, staged: true,
     owner: P6.1 recovery}
  - {id: hist_submission, path: "{p6}/submissions/p6_stack_fusion*.tif", required: false, staged: false,
     owner: P6 W2 (historical file; never re-uploaded)}
  - {id: hist_submission_sidecar, path: "{p6}/submissions/p6_stack_fusion*.json", required: false, staged: true,
     owner: P6 W2 (historical recipe; parity diagnostic only)}
  - {id: m9_selection, path: "{m9}/baseline/baseline_selection.json", required: true, staged: true, owner: M9}
  - {id: b0_manifest, path: "experiments/b0_reference__*/manifest.json", required: true, staged: false,
     expect_count: 1, owner: Phase-5 B0, expected_id: b0_reference__d54e938a}
  - {id: b1_manifest, path: "experiments/b1_bg_weight__*/manifest.json", required: true, staged: false,
     expect_count: 1, owner: Phase-5 B1, expected_id: b1_bg_weight__7755635b}
# CNN prediction rasters: the four maps M1 consumes are required BY NAME; other GeoTIFFs in the same folder (the
# per-fold oof_fold<k>.tif written by training.cv) are accepted, hashed and listed as extra_files. Files of several
# matching experiment directories are never combined (AMBIGUOUS); expected_id pins the recorded B0 / B1 run.
  - {id: b0_maps, path: "experiments/b0_reference__*/predictions/*.tif", required: true, staged: false,
     required_files: [oof.tif, disc0.tif, disc1.tif, disc2.tif], owner: Phase-5 B0,
     expected_id: b0_reference__d54e938a}
  - {id: b1_maps, path: "experiments/b1_bg_weight__*/predictions/*.tif", required: true, staged: false,
     required_files: [oof.tif, disc0.tif, disc1.tif, disc2.tif], owner: Phase-5 B1,
     expected_id: b1_bg_weight__7755635b}
  - {id: geo_folds, path: "outputs/benchmark/folds/geo_k3_b20km_buf13km_s2026", required: true, staged: false,
     owner: pipeline}
  - {id: disc_splits, path: "outputs/benchmark/folds/discovery_d3_link1km_s2026", required: true, staged: false,
     owner: pipeline}
  - {id: template, path: "data/raw/geodawn/example_submission.tif", alternates: ["data/raw/example_submission.tif"],
     required: true, staged: false, owner: DrivenData}
hash_max_mb: 256                                  # sha256 up to this size; larger files: size + mtime (recorded)
# Staging: ONLY the `staged: true` files above are copied to local disk (notebook stage 1); the session re-stages
# exactly that list (skip unchanged). Never staged: boost B/C/D, recovery/segments, seeds/ (W1), stack/models,
# checkpoint directories, other research outputs, the historical submission rasters.

# ------------------------------------------------------------------------------------------------ champion
# Candidates = configs/p6/full_gpu.yaml candidate names (same grid, same space) + the historical cell. Only the W2
# family and the B0+B1 fusion fallback are considered; nothing new is invented.
champion:
  candidates: [ref_p6_w2, a_w2_crest, a_w2_skeleton, a_w2_rep_frac, a_hybrid, rec_p6r_choice, ref_m9_fallback]
  extra_candidates:
    m1_w2_uploaded_cell: {grid: boost_a, cells: [w2], fixed: {rep: skeleton_1px, frac: 0.05, blend: 1.0},
                          deploy: stack, role: historical, family: p6_reference,
                          label: "historical uploaded cell (rep from disc, frac from geo choice): never selected"}
  grids: [boost_a]                                # the ONLY grids load_grids reads (sources=...)
  required_grids: [boost_a]                       # absent / empty / malformed -> selection BLOCKED (no fallback)
  family_of: {stack: w2, fusion: fusion, cnn: cnn}
# Recorded reference values (configs/p6/recovery.yaml references): checked for REPRODUCTION, never used as inputs.
# protocol: separate = disc and geo cells chosen independently (each task on its own labels; NOT one deployable file);
# fixed = one historical cell. The champion is single_policy (one cell chosen on discovery, applied to both tasks), so
# recorded DISCOVERY values are comparable (same selection criterion) and recorded separate GEO values are not.
recorded:
  w2_original: {source: stack_grid, params: [blend, rep, frac], protocol: separate, disc_dti: 0.224640,
                disc_worst: 0.153414, geo_dti: 0.180843}
  a_w2_crest: {source: boost_a, objective: separate, protocol: separate, disc_dti: 0.238882, disc_worst: 0.192575,
               geo_dti: 0.185609}
  a_w2_skeleton: {source: boost_a, objective: separate, protocol: separate, disc_dti: 0.242156, disc_worst: 0.198579,
                  geo_dti: 0.168841}
  m1_w2_uploaded_cell: {source: boost_a, objective: fixed, protocol: fixed, disc_dti: 0.178905, geo_dti: 0.168841}
# Single-policy values recorded by the P6.1 recovery run (docs/p6/P6_RECOVERY_TO_BOOST_AUDIT.md, X1 table): shown
# next to the champion in validation/protocol_comparison.csv for context only (never reproduced, never gating).
recorded_single_policy:
  p61_A_w2_original: {disc_dti: 0.224640, disc_worst: 0.153414, geo_dti: 0.102664}
  p61_B_w2_crest: {disc_dti: 0.238882, disc_worst: 0.192575, geo_dti: 0.114259}
  p61_C_w2_skeleton: {disc_dti: 0.242156, disc_worst: 0.198579, geo_dti: 0.105687}
  p61_R_fallback_fusion: {disc_dti: 0.162482, disc_worst: 0.126160, geo_dti: 0.158416}
selection:
  overrides: {}                                   # merged over configs/p6/full_gpu.yaml selection (p6g rule)
  geo_floor: 0.1758                               # recorded P6 promotion floor (configs/p6/{boost,recovery}.yaml)
  geo_floor_blocking: false                       # true: the floor is part of the SELECTION rule (p6g gate mode);
                                                  # false keeps the selection reproducible (the promotion gate below
                                                  # still applies the floor)

# ------------------------------------------------------------------------------------------------ promotion
# Separate from selection: a COMPLETE selection is not a promotion. READY_FOR_EXPORT needs every mandatory gate.
promotion:
  geographic_gate: mandatory                      # mandatory: geo DTI < geo_floor blocks export. advisory: reported
                                                  # as WARNING; requires override_note (recorded in every manifest)
  override_note: ""

# ------------------------------------------------------------------------------------------------ validation
validation:
  component_rtol: 1.0e-6                          # recomputed vs saved grid row (same code path -> float rounding)
  component_atol: 1.0e-6
  dti_atol: 1.0e-6
  recorded_atol: 6.0e-6                           # recorded values have 6 decimals
  parity_min_spearman: 0.999                      # zone score vs evaluation construction (per geo unit)
  strict_parity: true                             # any non-PASS zone-score parity row blocks (incl. fusion-w WARNING)
  max_uncovered_frac: 0.001
  recorded_mismatch: warning                      # recorded value not reproduced: warning (default; the binding
                                                  # checks are the component recomputation + sha256) | blocking

# ------------------------------------------------------------------------------------------------ outputs
outputs: {save_figures: true, save_parquet: true, save_geotiff: true, sync_to_drive: true}   # set by notebook CONFIG

# ------------------------------------------------------------------------------------------------ submission
submission:
  prefix: submission_m1                           # submissions/<prefix>_<family>_<recipe_id>.tif
  max_size_mb: 50
  expected: {epsg: 32611, res_m: 100.0, dtype: float32, count: 1}

# Opt-in exploratory baseline (M1.3). Default OFF. Only when the champion is TECHNICALLY valid (selection,
# discovery eligibility, validation and parity all PASS / WARNING) and the ONLY failing gate is GEOGRAPHIC_GATE_PASS.
# Writes submissions/<prefix>_<family>_<recipe_id>.tif with status EXPLORATORY_READY (never READY_FOR_UPLOAD), its own
# manifest / sha256 / README; the champion submission stays BLOCKED; nothing is uploaded. reason is mandatory.
exploratory:
  enabled: false
  reason: ""
  prefix: exploratory_m1

# Read-only Drive preflight (M1.3): runs before the engine, writes diagnostics/ only.
preflight:
  sample_px: 2000000                              # max pixels sampled per NPY / GeoTIFF for value statistics
  hash_max_mb: 16                                 # sha256 of files up to this size (GeoTIFFs: size + mtime)
  full_read_max_mb: 32                            # CSV duplicate / null checks only below this size

leaderboard:
  max_scored_per_week: 3
  tie_delta: 0.005
