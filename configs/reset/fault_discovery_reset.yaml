# GEMS fault-discovery reset (docs/FAULT_DISCOVERY_RESET_HANDOFF.md, gems_bench/reset/). Code-authoring-first:
# every number comes from the user's Colab run. Frozen B0 / B1 / W2 predictions, folds, scenarios, scorer and writer
# are reused through the GeoMoE runner and the submission factory. Every threshold is predeclared.
version: fdr.1
output_dir: outputs/fault_discovery_reset

bands:                                   # GeoDAWN band names (docs/DATA_PROVENANCE.md); absent ones are UNAVAILABLE
  magnetic: rtp
  gravity: iso_grav_anom
  terrain: det_elev
  terrain_slope: det_elev_slope

atlas:
  n_examples: 48
  seed: 2026
  patch_size_px: 256                     # 25.6 km windows at 100 m
  min_separation_km: 10.0                # candidates closer than this are not both kept (no near-duplicates)
  region_grid: [3, 3]                    # regions over the valid footprint bounding box
  eval_regions: [0, 4, 8]                # predeclared review EVALUATION regions (never used to train a verifier)
  categories:                            # quota share per category (normalised)
    A_known_supported: 1
    B_missed_mapped: 1
    C_w2_unmapped: 1
    D_lineament_low_w2: 1
    E_cnn_disagreement: 1
    F_suspected_nonfault: 1
    G_short_fragmented: 1
    H_regional_random: 1
  thresholds:
    unmapped_km: 1.0                     # C / D: farther than this from any mapped fault
    missed_km: 0.3                       # B: mapped pixels farther than this from the frozen W2 map
    short_km: 2.0                        # G
    lineament_top: 0.03                  # top share of the label-free lineament score (crest lines)
    disagreement: 0.5                    # E: |rank difference|
    single_edge_q: 0.95                  # F: strong magnetic edge ...
    weak_other_q: 0.5                    #    ... with weak gravity edge
  stretch_percentiles: [2, 98]           # per-window display stretch (recorded per panel)

physics:
  sigmas_px: [1, 3, 8, 20]               # 100 m, 300 m, 800 m, 2 km smoothing scales
  probe_km: 3.0                          # straight probe through a point candidate
  profile_half_km: 5.0
  parallel_offset_km: 1.0                # side profiles for disruption / offset
  max_lag_px: 10
  thresholds: {present_rank: 0.8, coherence: 0.5, step_z: 1.0, disruption_corr: 0.3, offset_corr: 0.5,
               offset_lag_px: 2}
  localization_km: [0.3, 1.0, 3.0]

benchmark:
  representations:                       # gems3.representation syntax; added to the engine at attach (recorded)
    skeleton_1px: {select: top, post: [[skeleton, {width_px: 0}]]}
    crest_1px: {select: crest}
    skeleton_3px: {select: top, post: [[skeleton, {width_px: 1}]]}
    halo_soft: {select: crest, post: [[two_level, {halo_px: 1, halo_value: 0.7}]]}
    confidence_width: {select: crest, post: [[confidence_width, {hi_quantile: 0.5, extra_px: 1}]]}
  diagnostic_representations: [continuous_ramp, evidence_weighted_skeleton]   # reset-only ops: never exported
  # The factory validator (export_parity.audit_export) enforces realised area <= frac x (1 + tol): only
  # representations that do not dilate the selection can be written. Soft / dilated ones are measured, not exported.
  exportable_representations: [skeleton_1px, crest_1px]
  area_fracs: [0.005, 0.01, 0.015, 0.03, 0.05]
  baseline_reps: [skeleton_1px, crest_1px]
  realized_budgets: [0.002, 0.004, 0.006, 0.01, 0.02]   # common realised mass / area fractions for interpolation
  reference_prediction: null             # optional path (Drive-relative) of an organiser reference GeoTIFF

terrain:
  min_covered_share: 0.01                # of the valid footprint, else STOP
  min_unique_structures: 3               # terrain crest components > 300 m from frozen W2 and mapped faults
  frac: 0.01
  max_tiles: 30

challenger:
  min_reviewed_positive: 20              # Case 2 needs this many reviewed LIKELY / POSSIBLE faults in TRAIN regions
  min_reviewed_negative: 20
  hard_negative: [LIKELY_CONTACT, POSSIBLE_INTRUSION_OR_DYKE, TERRAIN_OR_DRAINAGE_ARTIFACT,
                  SURVEY_OR_PROCESSING_ARTIFACT]
  localization_floor: 0.15               # Case 4 hint: best source places < this share of truth within 300 m
  selection: {min_gain_vs_w2: 0.005, min_scenarios_improved: 2, max_scenario_drop: 0.01, max_worst_zone_drop: 0.01,
              min_p_positive: 0.8}
